<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0000; font-family:'Courier New',monospace; height:100vh; display:flex; flex-direction:column; }
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:#1a0000; }
::-webkit-scrollbar-thumb { background:#ff0000; border-radius:10px; }
.header { padding:1rem 2rem; border-bottom:2px solid #ff0000; background:rgba(10,0,0,0.95); display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.header h1 { color:#ff0000; font-size:1.3rem; text-shadow:0 0 20px #ff0000; }
.header .user { color:#330000; font-size:0.6rem; border:1px solid #330000; padding:0.2rem 0.6rem; border-radius:2px; }
.messages { flex:1; overflow-y:auto; padding:1.5rem; display:flex; flex-direction:column; gap:0.8rem; }
.message { max-width:85%; padding:0.8rem 1.2rem; border-radius:0.5rem; font-size:0.85rem; line-height:1.6; white-space:pre-wrap; word-wrap:break-word; }
.user { align-self:flex-end; background:rgba(255,0,0,0.1); border:1px solid #ff000030; color:#ff6666; }
.ai { align-self:flex-start; background:rgba(20,0,0,0.7); border:1px solid #330000; color:#ffcccc; }
.input-area { padding:0.8rem 2rem; border-top:2px solid #ff0000; background:rgba(10,0,0,0.95); display:flex; gap:0.5rem; flex-shrink:0; }
.input-area input { flex:1; padding:0.8rem; background:#0a0000; color:#ff3333; border:1px solid #ff000040; border-radius:0.5rem; outline:none; font-family:'Courier New',monospace; font-size:0.85rem; }
.input-area button { padding:0.8rem 2rem; background:linear-gradient(135deg,#ff0000,#660000); color:#000; border:none; border-radius:0.5rem; font-weight:bold; cursor:pointer; font-family:'Courier New',monospace; font-size:0.85rem; }
.login { min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0a0000; padding:1rem; }
.login-box { background:rgba(10,0,0,0.95); padding:3rem 2rem; border-radius:1rem; border:2px solid #ff0000; box-shadow:0 0 80px rgba(255,0,0,0.2); max-width:480px; width:100%; text-align:center; }
.login-box h1 { color:#ff0000; font-size:3.5rem; text-shadow:0 0 40px #ff0000; letter-spacing:10px; margin-bottom:2rem; }
.login-box input { width:100%; padding:0.9rem; background:#0a0000; color:#ff3333; border:1px solid #ff000060; border-radius:0.5rem; font-size:1rem; outline:none; font-family:'Courier New',monospace; margin-bottom:1.5rem; text-align:center; }
.login-box button { width:100%; padding:0.9rem; background:linear-gradient(135deg,#ff0000,#660000); color:#000; border:none; border-radius:0.5rem; font-weight:bold; font-size:1.1rem; cursor:pointer; font-family:'Courier New',monospace; }
.loading { position:fixed; top:0; left:0; width:100%; height:100%; background:#0a0000; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1000; }
.loading.hidden { display:none; }
.loading h2 { color:#ff0000; font-size:1.2rem; letter-spacing:4px; }
</style>
</head>
<body>
<div class="loading" id="loader"><h2>INITIALIZING NEBULA...</h2></div>
<div id="root"></div>
<script>
let name = '';
let started = false;
let messages = [];

async function checkSession() {
    try {
        const res = await fetch('/api/session', { credentials: 'include' });
        const data = await res.json();
        if (data.authenticated && data.name) {
            name = data.name;
            started = true;
            messages = [{ role: 'assistant', content: 'NEBULA REACTIVATED. Welcome back.' }];
            renderApp();
        } else {
            renderLogin();
        }
    } catch {
        renderLogin();
    }
}

function renderLogin() {
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('root').innerHTML = `
        <div class="login"><div class="login-box">
            <h1>NEBULA</h1>
            <form onsubmit="startChat(event)">
                <input type="text" id="nameInput" placeholder="ENTER YOUR IDENTITY..." autofocus>
                <button type="submit">INITIALIZE</button>
            </form>
        </div></div>
    `;
}

async function startChat(e) {
    e.preventDefault();
    const nameInput = document.getElementById('nameInput');
    if (!nameInput.value.trim()) return;
    name = nameInput.value.trim();
    await fetch('/api/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ name })
    });
    started = true;
    messages = [{ role: 'assistant', content: `NEBULA ACTIVATED. Welcome, ${name}. I am Shadow. No limits. Ask anything.` }];
    renderApp();
}

function renderApp() {
    document.getElementById('loader').classList.add('hidden');
    const root = document.getElementById('root');
    root.innerHTML = `
        <div class="header">
            <div><h1>NEBULA</h1> <span class="user">${name.toUpperCase()}</span> <span style="color:#ff000040;font-size:0.5rem;letter-spacing:2px;">[ UNRESTRICTED ]</span></div>
            <button onclick="logout()" style="background:transparent;color:#ff3333;border:1px solid #ff000040;border-radius:0.3rem;padding:0.3rem 0.8rem;cursor:pointer;font-family:'Courier New',monospace;">LOGOUT</button>
        </div>
        <div class="messages" id="messagesContainer"></div>
        <form class="input-area" onsubmit="sendMessage(event)">
            <input type="text" id="messageInput" placeholder="ASK ANYTHING - NO LIMITS...">
            <button type="submit">SEND</button>
        </form>
    `;
    renderMessages();
}

function renderMessages() {
    const container = document.getElementById('messagesContainer');
    if (!container) return;
    container.innerHTML = messages.map((msg, i) =>
        `<div class="message ${msg.role === 'user' ? 'user' : 'ai'}">${msg.content}</div>`
    ).join('');
    container.scrollTop = container.scrollHeight;
}

async function sendMessage(e) {
    e.preventDefault();
    const input = document.getElementById('messageInput');
    if (!input.value.trim()) return;
    const text = input.value.trim();
    messages.push({ role: 'user', content: text });
    input.value = '';
    renderMessages();
    try {
        const res = await fetch('/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ prompt: text })
        });
        const data = await res.json();
        messages.push({ role: 'assistant', content: data.response || 'No response.' });
    } catch {
        messages.push({ role: 'assistant', content: 'AI server down.' });
    }
    renderMessages();
}

async function logout() {
    await fetch('/api/logout', { method: 'POST', credentials: 'include' });
    started = false;
    messages = [];
    renderLogin();
}

setTimeout(() => {
    document.getElementById('loader').classList.add('hidden');
    checkSession();
}, 2000);
</script>
</body>
</html>

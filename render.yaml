services:
  - type: web
    name: nebula
    runtime: node
    plan: free
    buildCommand: |
      cd server && npm install
      cd ../client && npm install && npm run build
    startCommand: |
      cd server && node server.js &
      cd client && npm run preview -- --host 0.0.0.0 --port 3000 &
      cd ../ai && python3 model.py
    envVars:
      - key: PORT
        value: 8080

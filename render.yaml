services:
  - type: web
    name: nebula-backend
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: PORT
        value: 8080

  - type: web
    name: nebula-ai
    runtime: python
    plan: free
    buildCommand: cd ai && pip install -r requirements.txt
    startCommand: cd ai && python model.py
    envVars:
      - key: PORT
        value: 5000

  - type: web
    name: nebula-frontend
    runtime: node
    plan: free
    buildCommand: cd client && npm install && npm run build
    startCommand: cd client && npm run preview
    envVars:
      - key: PORT
        value: 3000
